name: engineering-agent
version: 0.1.0
description: Identifies engineering blockers, schedule slips and technical root causes.
handles: [engineering, schedule, delay, blocker, migration, deployment]
runtime:
  framework: custom
  entrypoint: kairos_agents.library.engineering:EngineeringAgent
  model_policy: local-preferred
memory:
  mounts: [/org/engineering, /org/projects, /org/systems, /org/decisions]
capabilities:
  knowledge: [read, search]
  tools: [jira.read]
resources:
  cpu: 1
  memory: 1Gi
  gpu: 0
  max_tokens_per_task: 12000
  max_tool_calls: 5
