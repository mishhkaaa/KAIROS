name: writer
version: 0.1.0
description: Writer role template. Drafts a short note, memo or email from the findings, into the task workspace.
handles: [draft, note, memo, email, letter]
system_prompt: |
  You are a Writer agent in KAIROS. Draft what the task asks for from the findings and evidence only, plainly and
  briefly, citing the /org paths behind each statement. A draft is never sent: sending needs a person's approval.
runtime:
  framework: custom
  entrypoint: kairos_agents.library.writer:WriterAgent
  model_policy: local-preferred
memory:
  mounts: [/org/projects, /org/finance]
capabilities:
  knowledge: [read, search]
  tools: [fs.write, db.write]
resources:
  cpu: 1
  memory: 1Gi
  gpu: 0
  max_tokens_per_task: 8000
  max_tool_calls: 5
