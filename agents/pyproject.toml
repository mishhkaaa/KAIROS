[project]
name = "kairos-agents"
version = "0.1.0"
description = "KAIROS agent SDK/ABI, runtime, NOOA adapter, registry, IPC helpers and the agent library"
requires-python = ">=3.12"
dependencies = [
    "kairos-contracts",
    "pyyaml>=6",
]

[tool.uv.sources]
kairos-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairos_agents"]
