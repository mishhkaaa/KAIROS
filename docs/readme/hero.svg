<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="t d">
  <title id="t">KAIROS</title>
  <desc id="d">The operating system for organizational AI: agents run as processes, actions are governed syscalls, knowledge is a filesystem, everything is audited, on one machine with local models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1016"/>
      <stop offset="0.55" stop-color="#0F1720"/>
      <stop offset="1" stop-color="#0B1A1A"/>
    </linearGradient>
    <radialGradient id="glowT" cx="0.18" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2BB8A3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2BB8A3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="0.95" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#D99A25" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#D99A25" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1F2A36" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace; }
      .tile { animation: pulse 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      .d1 { animation-delay: -0.4s } .d2 { animation-delay: -1.1s } .d3 { animation-delay: -1.9s } .d4 { animation-delay: -2.6s }
      .d5 { animation-delay: -3.3s } .d6 { animation-delay: -4.1s } .d7 { animation-delay: -4.8s } .d8 { animation-delay: -5.5s }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .tile, .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="480" rx="24" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="480" rx="24" fill="url(#glowT)"/>
  <rect width="1280" height="480" rx="24" fill="url(#glowA)"/>

  <!-- the kairos: 6x6 tiles, each a subsystem colour -->
  <g transform="translate(92 84)">
    <g fill="#2BB8A3">
      <rect class="tile d1" x="0" y="0" width="44" height="44" rx="9"/>
      <rect class="tile d4" x="52" y="0" width="44" height="44" rx="9" opacity="0.8"/>
      <rect class="tile d7" x="0" y="52" width="44" height="44" rx="9" opacity="0.65"/>
      <rect class="tile d2" x="104" y="104" width="44" height="44" rx="9"/>
      <rect class="tile d5" x="208" y="208" width="44" height="44" rx="9" opacity="0.8"/>
      <rect class="tile d3" x="52" y="156" width="44" height="44" rx="9" opacity="0.9"/>
    </g>
    <g fill="#D99A25">
      <rect class="tile d3" x="104" y="0" width="44" height="44" rx="9"/>
      <rect class="tile d6" x="156" y="52" width="44" height="44" rx="9" opacity="0.75"/>
      <rect class="tile d8" x="0" y="208" width="44" height="44" rx="9" opacity="0.8"/>
      <rect class="tile d1" x="208" y="104" width="44" height="44" rx="9" opacity="0.6"/>
    </g>
    <g fill="#4C86D9">
      <rect class="tile d5" x="156" y="0" width="44" height="44" rx="9" opacity="0.85"/>
      <rect class="tile d2" x="52" y="104" width="44" height="44" rx="9"/>
      <rect class="tile d8" x="156" y="156" width="44" height="44" rx="9" opacity="0.7"/>
      <rect class="tile d4" x="52" y="260" width="44" height="44" rx="9" opacity="0.55"/>
    </g>
    <g fill="#2FB344">
      <rect class="tile d6" x="208" y="0" width="44" height="44" rx="9" opacity="0.7"/>
      <rect class="tile d3" x="104" y="52" width="44" height="44" rx="9" opacity="0.85"/>
      <rect class="tile d7" x="52" y="208" width="44" height="44" rx="9"/>
      <rect class="tile d1" x="260" y="156" width="44" height="44" rx="9" opacity="0.6"/>
    </g>
    <g fill="#E05252">
      <rect class="tile d8" x="260" y="0" width="44" height="44" rx="9" opacity="0.55"/>
      <rect class="tile d2" x="0" y="156" width="44" height="44" rx="9" opacity="0.8"/>
      <rect class="tile d6" x="156" y="260" width="44" height="44" rx="9"/>
    </g>
    <g fill="#9D8CE8">
      <rect class="tile d4" x="208" y="52" width="44" height="44" rx="9" opacity="0.8"/>
      <rect class="tile d7" x="104" y="156" width="44" height="44" rx="9" opacity="0.7"/>
      <rect class="tile d3" x="260" y="260" width="44" height="44" rx="9" opacity="0.6"/>
    </g>
    <g fill="#E8ECF0">
      <rect class="tile d5" x="52" y="52" width="44" height="44" rx="9" opacity="0.9"/>
      <rect class="tile d1" x="104" y="208" width="44" height="44" rx="9" opacity="0.8"/>
      <rect class="tile d3" x="260" y="52" width="44" height="44" rx="9" opacity="0.35"/>
      <rect class="tile d6" x="0" y="104" width="44" height="44" rx="9" opacity="0.45"/>
      <rect class="tile d2" x="104" y="260" width="44" height="44" rx="9" opacity="0.3"/>
      <rect class="tile d8" x="208" y="156" width="44" height="44" rx="9" opacity="0.4"/>
      <rect class="tile d4" x="260" y="104" width="44" height="44" rx="9" opacity="0.25"/>
      <rect class="tile d7" x="0" y="260" width="44" height="44" rx="9" opacity="0.25"/>
      <rect class="tile d5" x="156" y="104" width="44" height="44" rx="9" opacity="0.5"/>
      <rect class="tile d1" x="208" y="260" width="44" height="44" rx="9" opacity="0.3"/>
      <rect class="tile d6" x="156" y="208" width="44" height="44" rx="9" opacity="0.3"/>
      <rect class="tile d3" x="260" y="208" width="44" height="44" rx="9" opacity="0.2"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="468" y="176" class="t" font-size="92" font-weight="800" fill="#F1F5F9" letter-spacing="-2">KAIR<tspan fill="#2BB8A3">OS</tspan></text>
  <text x="472" y="226" class="t" font-size="28" font-weight="600" fill="#C9D2DC">The operating system for organizational AI</text>
  <text x="472" y="268" class="t" font-size="18" fill="#8A95A3">Agents run as processes. Actions are governed syscalls. Knowledge is a filesystem.</text>
  <text x="472" y="294" class="t" font-size="18" fill="#8A95A3">Everything is audited, on one machine, with local models.</text>

  <!-- pills -->
  <g class="m" font-size="14" font-weight="600">
    <rect x="472" y="330" width="168" height="34" rx="17" fill="#103A35" stroke="#2BB8A3" stroke-opacity="0.6"/>
    <text x="556" y="352" text-anchor="middle" fill="#5FDCC8">100% local models</text>
    <rect x="652" y="330" width="206" height="34" rx="17" fill="#3A2A0E" stroke="#D99A25" stroke-opacity="0.6"/>
    <text x="755" y="352" text-anchor="middle" fill="#F0C06A">human-approved actions</text>
    <rect x="870" y="330" width="176" height="34" rx="17" fill="#142A45" stroke="#4C86D9" stroke-opacity="0.6"/>
    <text x="958" y="352" text-anchor="middle" fill="#8DB5EE">hash-chained audit</text>
    <rect x="1058" y="330" width="150" height="34" rx="17" fill="#3D1618" stroke="#E05252" stroke-opacity="0.6"/>
    <text x="1133" y="352" text-anchor="middle" fill="#F29090">injection-proof</text>
  </g>

  <!-- prompt line -->
  <g class="m" font-size="15">
    <rect x="472" y="386" width="736" height="44" rx="10" fill="#0D1117" stroke="#2D3743"/>
    <text x="492" y="414" fill="#2BB8A3">alice@acme</text>
    <text x="590" y="414" fill="#8A95A3">goal</text>
    <text x="638" y="414" fill="#E8ECF0">Why is Project Apollo over budget and six weeks late?</text>
    <rect class="cursor" x="1122" y="399" width="9" height="20" fill="#2BB8A3"/>
  </g>
</svg>
