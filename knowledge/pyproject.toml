[project]
name = "kairos-knowledge"
version = "0.1.0"
description = "KAIROS knowledge fabric (OKF, ingestion, hybrid retrieval, graph, knowledge filesystem) and memory manager"
requires-python = ">=3.12"
dependencies = [
    "kairos-contracts",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "networkx>=3.3",
    "watchfiles>=0.22",
    "markdown-it-py>=3",
    "typer>=0.12",
]

[project.optional-dependencies]
ingest = ["markitdown[docx,pdf,pptx,xlsx]>=0.1"]  # pdf/docx/pptx/xlsx -> markdown; format backends are extras since 0.1

[project.scripts]
kairos-okf = "kairos_knowledge.cli:main"

[tool.uv.sources]
kairos-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairos_knowledge"]
