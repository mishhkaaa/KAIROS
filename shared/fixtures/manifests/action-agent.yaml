name: action-agent
version: 0.1.0
description: Turns an approved plan into concrete tool actions (tracker updates, reports) through governed syscalls.
handles: [action, update tracker, jira, write report]
runtime:
  framework: custom
  entrypoint: kairos_agents.library.action:ActionAgent
  model_policy: local-preferred
memory:
  mounts: [/org/projects]
capabilities:
  knowledge: [read, search]
  tools: [jira.read, jira.write, fs.write]
resources:
  cpu: 1
  memory: 1Gi
  gpu: 0
  max_tokens_per_task: 8000
  max_tool_calls: 10
network:
  allow: [jira.company.internal:443]
approval:
  required: [jira.write]
