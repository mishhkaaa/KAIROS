[project]
name = "kairos-contracts"
version = "0.1.0"
description = "KAIROS shared contracts: schemas, interfaces, fakes, contract tests, gateway API spec"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
kairos-mock-gateway = "kairos_contracts.api.mock_gateway:main"
kairos-export-contracts = "kairos_contracts.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairos_contracts"]
